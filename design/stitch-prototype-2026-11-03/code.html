<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FAP Attendance — Interactive Prototype Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#C93C13',
            'primary-dark': '#A32F0D',
            'primary-soft': '#FFF0E8',
            brand: '#F4511E',
            bgLight: '#FFF7F3',
            surface: '#FFFFFF',
            textMain: '#243047',
            textSub: '#667085',
            borderSub: '#E5E9F0',
            success: '#16835D',
            error: '#C93A2B',
            info: '#2563B8'
          },
          fontFamily: {
            sans: ['"Roboto Flex"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #1E2430;
      font-family: 'Roboto Flex', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #243047;
    }
    /* Mobile frame container */
    #phone-container {
      width: 412px;
      height: 860px;
      background: #FFF7F3;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45), 0 0 0 10px #2D3748;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 38px;
      background: #C93C13;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      flex-shrink: 0;
    }
    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      background: #FFF7F3;
      -webkit-overflow-scrolling: touch;
    }
    .screen-content::-webkit-scrollbar {
      width: 4px;
    }
    .screen-content::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    /* Flow pill switcher on top */
    .flow-controller {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 4px 6px;
      border-radius: 999px;
      display: flex;
      gap: 4px;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .flow-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      color: #94A3B8;
      transition: all 0.2s ease;
      cursor: pointer;
      white-space: nowrap;
    }
    .flow-btn.active {
      background: #C93C13;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(201, 60, 19, 0.4);
    }
    /* Interactive click hotspot ripple */
    .clickable {
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    .clickable:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    /* Navigation Bottom Tab */
    .bottom-nav {
      height: 60px;
      background: #FFFFFF;
      border-top: 1px solid #E5E9F0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      z-index: 40;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 500;
      color: #667085;
      cursor: pointer;
    }
    .nav-item.active {
      color: #C93C13;
      font-weight: 700;
    }
    /* Modal / Bottom sheet overlay */
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(36, 48, 71, 0.6);
      backdrop-filter: blur(2px);
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-box {
      background: #FFFFFF;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 28px 20px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      max-height: 85%;
      overflow-y: auto;
    }
    .sheet-overlay.open .sheet-box {
      transform: translateY(0);
    }
    /* Toast notifications */
    #toast-msg {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1E293B;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 90;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    #toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
<!-- Floating Flow Switcher -->
<div class="flow-controller">
<div class="flow-btn active" id="btn-f1" onclick="switchStartingPoint('F1')">Flow 1: Cấu hình</div>
<div class="flow-btn" id="btn-classes" onclick="switchStartingPoint('CLASSES')">S02: Danh sách lớp</div>
<div class="flow-btn" id="btn-f2" onclick="switchStartingPoint('F2')">Flow 2: QR &amp; Chốt</div>
<div class="flow-btn" id="btn-f3" onclick="switchStartingPoint('F3')">Flow 3: Sửa &amp; Xuất</div>
</div>
<!-- Toast Notification -->
<div id="toast-msg"><i class="fa-solid fa-circle-check text-green-400"></i> <span id="toast-text">Thông báo</span></div>
<!-- Mobile Simulator Frame -->
<div id="phone-container">
<!-- Status Bar -->
<div class="status-bar">
<span>09:30</span>
<div class="flex items-center gap-2 text-xs">
<i class="fa-solid fa-wifi"></i>
<i class="fa-solid fa-signal"></i>
<i class="fa-solid fa-battery-full"></i>
</div>
</div>
<!-- Screen Content Container (Router switches views inside here) -->
<div class="screen-content" id="app-viewport">
<!-- Views will be dynamically swapped by JavaScript -->
</div>
<!-- Bottom Tab Navigation (Visible on S02 grid, s02_class_list and S10) -->
<div class="bottom-nav hidden" id="global-bottom-nav">
<div class="nav-item active" id="tab-s02" onclick="navigateTo('s02_class_list')">
<i class="fa-regular fa-calendar-days text-lg"></i>
<span>Lịch tuần &amp; Lớp học</span>
</div>
<div class="nav-item" id="tab-s10" onclick="navigateTo('S10')">
<i class="fa-brands fa-google-drive text-lg"></i>
<span>Google Drive</span>
</div>
</div>
<!-- Global Interactive Overlays / Bottom Sheets -->
<div class="sheet-overlay" id="global-overlay" onclick="closeOverlay(event)">
<div class="sheet-box" id="overlay-content" onclick="event.stopPropagation()">
<!-- Dynamic overlay body injected here -->
</div>
</div>
</div>
<script>
    // System State Store
    const state = {
      currentScreen: 'S01',
      historyStack: [],
      workspaceReady: false,
      slot5Closed: false,
      slot5Present: 26,
      slot5Absent: 4,
      slot5Pending: 0,
      studentNoteReason: "Bổ sung có mặt sau khi kiểm tra lại camera lớp học.",
      studentStatus: "P",
      driveConnected: true,
      exportFormat: 'json',
      backupDrive: true,
      activeFlow: 'F1',
      // Class expansion state in S02 Class List
      classesExpanded: {
        SE1920: true,
        SE1921: false,
        SE1918: false
      }
    };

    function showToast(text, isError = false) {
      const toast = document.getElementById('toast-msg');
      const toastText = document.getElementById('toast-text');
      toast.querySelector('i').className = isError ? "fa-solid fa-circle-exclamation text-red-400" : "fa-solid fa-circle-check text-green-400";
      toastText.innerText = text;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    function toggleClassExpand(classId) {
      state.classesExpanded[classId] = !state.classesExpanded[classId];
      renderCurrentScreen();
    }

    function switchStartingPoint(flow) {
      state.activeFlow = flow;
      document.querySelectorAll('.flow-btn').forEach(btn => btn.classList.remove('active'));
      const activeEl = document.getElementById('btn-' + flow.toLowerCase());
      if (activeEl) activeEl.classList.add('active');

      if (flow === 'F1') {
        navigateTo('S01', true);
        showToast('Điểm bắt đầu Flow 1: Chuẩn bị & Cấu hình');
      } else if (flow === 'CLASSES') {
        state.workspaceReady = true;
        navigateTo('s02_class_list', true);
        showToast('Màn hình mới: S02 Dashboard Danh sách Lớp học');
      } else if (flow === 'F2') {
        state.workspaceReady = true;
        navigateTo('s02_class_list', true);
        showToast('Điểm bắt đầu Flow 2: Điểm danh QR & Chốt');
      } else if (flow === 'F3') {
        state.workspaceReady = true;
        navigateTo('S08', true);
        showToast('Điểm bắt đầu Flow 3: Xem Note, Sửa & Xuất file');
      }
    }

    function navigateTo(screenId, clearStack = false) {
      if (clearStack) {
        state.historyStack = [];
      } else {
        state.historyStack.push(state.currentScreen);
      }
      state.currentScreen = screenId;
      renderCurrentScreen();
    }

    function goBack() {
      if (state.historyStack.length > 0) {
        state.currentScreen = state.historyStack.pop();
        renderCurrentScreen();
      } else {
        navigateTo('s02_class_list');
      }
    }

    function openOverlay(type, data = {}) {
      const overlay = document.getElementById('global-overlay');
      const box = document.getElementById('overlay-content');
      
      if (type === 'CONFIRM_CLOSE_SLOT5') {
        box.innerHTML = `
          <div class="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
          <div class="flex items-center gap-3 mb-3 text-primary">
            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            <h3 class="text-lg font-bold text-textMain">Xác nhận chốt danh sách Slot 5</h3>
          </div>
          <p class="text-sm text-textSub mb-4 leading-relaxed">
            Học phần: <b>PRN232 · SE1920</b> (Hôm nay 24/09/2026).<br>
            Hiện tại đã ghi nhận <b>26 sinh viên có mặt</b>. Còn <b>4 sinh viên chưa check-in</b> sẽ tự động chuyển thành <b>Vắng (A)</b>.
          </p>
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-5 text-xs text-amber-800 flex items-start gap-2">
            <i class="fa-solid fa-circle-info mt-0.5 text-amber-600"></i>
            <span>Sau khi chốt, mã QR sẽ dừng nhận điểm danh. Bạn vẫn có thể xem lại và sửa có lý do sau này.</span>
          </div>
          <div class="flex gap-3">
            <button class="flex-1 py-3 px-4 rounded-xl border border-slate-300 text-textMain font-semibold text-sm clickable" onclick="closeOverlay()">Tiếp tục điểm danh</button>
            <button class="flex-1 py-3 px-4 rounded-xl bg-primary text-white font-semibold text-sm clickable" onclick="confirmCloseSlot5()">Đồng ý chốt</button>
          </div>
        `;
      } else if (type === 'VIEW_NOTE') {
        box.innerHTML = `
          <div class="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-bold text-textMain flex items-center gap-2">
              <i class="fa-solid fa-clipboard-list text-primary"></i> Ghi chú & Lịch sử chỉnh sửa
            </h3>
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-orange-100 text-primary">Slot 4</span>
          </div>
          <div class="bg-orange-50/60 border border-orange-100 rounded-xl p-3.5 mb-4 text-xs">
            <div class="flex justify-between items-center mb-1 text-textSub">
              <span>Sinh viên: <b>Nguyễn Hoàng Bảo Long</b></span>
              <span>MSSV: <b>SE180123</b></span>
            </div>
            <div class="text-textSub mb-2">Thời điểm sửa: 21/09/2026 • 10:15 bởi Giảng viên (Demo)</div>
            <div class="flex items-center gap-2 font-semibold text-textMain mb-2">
              <span class="px-2 py-0.5 bg-red-100 text-red-700 rounded line-through">A (Vắng)</span>
              <i class="fa-solid fa-arrow-right text-textSub text-xs"></i>
              <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded">P (Có mặt)</span>
            </div>
            <div class="bg-white p-2.5 rounded-lg border border-orange-200 text-textMain italic">
              "${state.studentNoteReason}"
            </div>
          </div>
          <p class="text-xs text-textSub mb-5 italic">Ghi chú lưu kèm trong tệp JSON slot và không bị mất sau ngày học.</p>
          <button class="w-full py-3 rounded-xl bg-primary text-white font-semibold text-sm clickable" onclick="closeOverlay()">Đóng</button>
        `;
      } else if (type === 'EDIT_STUDENT') {
        box.innerHTML = `
          <div class="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-base font-bold text-textMain">Sửa kết quả điểm danh Slot 4</h3>
            <span class="text-xs bg-slate-100 px-2 py-1 rounded text-textSub">SE180123</span>
          </div>
          <p class="text-xs text-textSub mb-4">Lớp PRN232_SE1920 • Thời gian 2 (09:30 - 11:45), Thứ Hai 21/09/2026</p>
          
          <div class="mb-4">
            <label class="block text-xs font-semibold text-textSub mb-2">Chọn trạng thái mới:</label>
            <div class="grid grid-cols-2 gap-3">
              <label class="flex items-center gap-2 p-2.5 rounded-xl border border-emerald-300 bg-emerald-50/50 cursor-pointer">
                <input type="radio" name="newStatus" value="P" checked class="text-emerald-600 focus:ring-emerald-500">
                <span class="text-xs font-semibold text-emerald-800">P · Có mặt</span>
              </label>
              <label class="flex items-center gap-2 p-2.5 rounded-xl border border-red-200 bg-red-50/30 cursor-pointer">
                <input type="radio" name="newStatus" value="A" class="text-red-600 focus:ring-red-500">
                <span class="text-xs font-semibold text-red-800">A · Vắng</span>
              </label>
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-xs font-semibold text-textSub mb-1">
              Lý do chỉnh sửa <span class="text-red-500">* (Bắt buộc)</span>:
            </label>
            <textarea id="editReasonInput" rows="3" class="w-full text-xs p-3 border border-slate-300 rounded-xl focus:border-primary focus:outline-none" placeholder="Nhập lý do chi tiết (không được để trống)...">${state.studentNoteReason}</textarea>
            <p id="editReasonError" class="text-xs text-red-500 mt-1 hidden"><i class="fa-solid fa-triangle-exclamation"></i> Vui lòng nhập lý do hợp lệ trước khi lưu.</p>
          </div>

          <div class="flex gap-3">
            <button class="flex-1 py-3 px-4 rounded-xl border border-slate-300 text-textMain font-semibold text-sm clickable" onclick="closeOverlay()">Hủy</button>
            <button class="flex-1 py-3 px-4 rounded-xl bg-primary text-white font-semibold text-sm clickable" onclick="saveStudentEdit()">Lưu thay đổi</button>
          </div>
        `;
      }
      overlay.classList.add('open');
    }

    function closeOverlay(event) {
      if (event && event.target !== document.getElementById('global-overlay')) return;
      document.getElementById('global-overlay').classList.remove('open');
    }

    function confirmCloseSlot5() {
      closeOverlay();
      state.slot5Closed = true;
      state.slot5Pending = 0;
      showToast('Đã chốt Slot 5 thành công (26 P, 4 A)');
      navigateTo('S04_CLOSED');
    }

    function saveStudentEdit() {
      const reason = document.getElementById('editReasonInput').value.trim();
      const err = document.getElementById('editReasonError');
      if (!reason) {
        err.classList.remove('hidden');
        return;
      }
      state.studentNoteReason = reason;
      closeOverlay();
      showToast('Đã lưu lý do và cập nhật kiểm toán');
      navigateTo('S07');
    }

    // ==========================================
    // SCREEN RENDERING ENGINE
    // ==========================================
    function renderCurrentScreen() {
      const viewport = document.getElementById('app-viewport');
      const bottomNav = document.getElementById('global-bottom-nav');
      
      // Control Bottom Nav visibility
      if (state.currentScreen === 'S02' || state.currentScreen === 's02_class_list' || state.currentScreen === 'S10') {
        bottomNav.classList.remove('hidden');
        document.getElementById('tab-s02').className = (state.currentScreen === 'S02' || state.currentScreen === 's02_class_list') ? "nav-item active" : "nav-item";
        document.getElementById('tab-s10').className = (state.currentScreen === 'S10') ? "nav-item active" : "nav-item";
      } else {
        bottomNav.classList.add('hidden');
      }

      switch(state.currentScreen) {

        // ==============================================
        // S01: Bắt đầu Workspace
        // ==============================================
        case 'S01':
          viewport.innerHTML = `
            <div class="p-6 flex flex-col justify-between min-h-full">
              <div class="pt-6">
                <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary text-3xl mb-5">
                  <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl font-bold text-textMain mb-2">FAP Attendance</h1>
                <p class="text-sm text-textSub mb-8 leading-relaxed">
                  Ứng dụng điểm danh mobile dành cho giảng viên Đại học FPT. Dữ liệu lưu cục bộ an toàn, tùy chọn sao lưu đám mây.
                </p>

                <div class="bg-white p-5 rounded-2xl border border-borderSub shadow-sm mb-5">
                  <label class="block text-xs font-semibold text-textSub mb-2">Email nhận diện giảng viên:</label>
                  <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                    <i class="fa-regular fa-envelope text-textSub"></i>
                    <input type="text" value="gv.demo@fpt.edu.vn" readonly class="bg-transparent w-full font-medium text-textMain outline-none">
                  </div>
                  <p class="text-[11px] text-textSub mt-2 italic">* Email dùng định danh workspace, không dùng phân quyền.</p>
                </div>
              </div>

              <div class="space-y-3 pb-4">
                <button class="w-full py-4 rounded-xl bg-primary text-white font-bold text-sm shadow-lg shadow-primary/25 flex items-center justify-center gap-2 clickable" onclick="navigateTo('S03')">
                  <i class="fa-solid fa-file-import"></i> Bắt đầu với markbook (ODS/XLSX)
                </button>
                <button class="w-full py-3.5 rounded-xl border border-slate-300 bg-white text-textMain font-semibold text-sm flex items-center justify-center gap-2 clickable" onclick="navigateTo('S10')">
                  <i class="fa-brands fa-google-drive text-amber-600"></i> Kết nối Google Drive
                </button>
              </div>
            </div>
          `;
          break;

        // ==============================================
        // S03: Import markbook
        // ==============================================
        case 'S03':
          viewport.innerHTML = `
            <div class="bg-white border-b border-borderSub px-4 py-3 flex items-center gap-3 sticky top-0 z-30">
              <button class="text-textSub text-lg clickable" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
              <h2 class="font-bold text-base text-textMain">Import markbook</h2>
            </div>
            <div class="p-5 space-y-5">
              <div class="bg-white p-4 rounded-2xl border border-borderSub shadow-sm">
                <span class="text-xs font-bold text-primary tracking-wide uppercase">Tệp nguồn</span>
                <div class="mt-3 flex items-center gap-3 p-3 bg-orange-50/50 border border-orange-100 rounded-xl">
                  <i class="fa-solid fa-file-excel text-emerald-600 text-2xl"></i>
                  <div class="flex-1 overflow-hidden">
                    <p class="text-xs font-bold text-textMain truncate">Markbook_FA26_PRN232_SE1920.xlsx</p>
                    <p class="text-[11px] text-textSub">Kích thước 48 KB • 30 sinh viên</p>
                  </div>
                  <button class="text-xs font-semibold text-primary px-2 py-1 bg-white rounded border border-orange-200 clickable" onclick="showToast('Chọn tệp khác...')">Đổi</button>
                </div>
              </div>

              <div class="bg-white p-4 rounded-2xl border border-borderSub shadow-sm space-y-4">
                <span class="text-xs font-bold text-textMain tracking-wide uppercase">Cấu hình học kỳ</span>
                <div>
                  <label class="block text-xs text-textSub mb-1">Học kỳ:</label>
                  <input type="text" value="FA26" readonly class="w-full text-xs font-semibold p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                </div>
                <div>
                  <label class="block text-xs text-textSub mb-1">Ngày bắt đầu học kỳ:</label>
                  <input type="text" value="Thứ Hai, 07/09/2026" readonly class="w-full text-xs font-semibold p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-textSub mb-1">Số tuần:</label>
                    <input type="text" value="10 tuần" readonly class="w-full text-xs font-semibold p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                  </div>
                  <div>
                    <label class="block text-xs text-textSub mb-1">Slot / tuần:</label>
                    <input type="text" value="2 slot/tuần" readonly class="w-full text-xs font-semibold p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                  </div>
                </div>
